services:
  tests:
    build:
      context: ../../../
      dockerfile: src/tests/functional/Dockerfile
    container_name: tests
    env_file:
      - ./.env
    depends_on:
      api-test:
        condition: service_started

  api-test:
    build:
      context: ../../../
    container_name: api-test
    env_file:
      - ../../../.env.test
    environment:
      WEB_CONCURRENCY: 2
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
    secrets:
      - jwt_private_key
      - jwt_public_key
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    restart: on-failure

  postgres-test:
    image: postgres:18
    container_name: postgres-test
    env_file:
      - .env
    volumes:
      - test_postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: on-failure

  redis-test:
    image: redis:8.10.1
    container_name: redis-test
    volumes:
      - test_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: on-failure

volumes:
  test_postgres_data:
  test_redis_data:

secrets:
  jwt_private_key:
    file: ../../../secrets/jwt-private.pem
  jwt_public_key:
    file: ../../../secrets/jwt-public.pem
